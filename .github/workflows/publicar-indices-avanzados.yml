name: DELTA - Validar o publicar MSI y NDRE

on:
  workflow_dispatch:
    inputs:
      parcela_id:
        description: "UUID de la parcela (debe tener NDVI/NDMI para esa fecha)"
        required: true
        type: string
      fecha_escena:
        description: "Fecha de NDVI/NDMI (YYYY-MM-DD)"
        required: true
        type: string
      publicar:
        description: "Publicar MSI y NDRE en Supabase (desactivado = validar solamente)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: delta-avanzados-${{ inputs.parcela_id }}
  cancel-in-progress: false

jobs:
  avanzados:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: api
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Validar o publicar MSI y NDRE
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          OPENEO_REFRESH_TOKEN: ${{ secrets.OPENEO_REFRESH_TOKEN }}
          PARCELA_ID: ${{ inputs.parcela_id }}
          FECHA_ESCENA: ${{ inputs.fecha_escena }}
          PUBLICAR_AVANZADOS: ${{ inputs.publicar }}
        run: python publicar_indices_avanzados.py
