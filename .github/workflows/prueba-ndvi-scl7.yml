name: DELTA - Prueba visual NDVI SCL7

on:
  workflow_dispatch:
    inputs:
      parcela_id:
        description: 'ID de la parcela a diagnosticar'
        required: true
        type: string
        default: '8e6a5e27-d0f4-4e49-a573-1387aec88598'
      fecha_escena:
        description: 'Fecha del mapa NDVI YYYY-MM-DD'
        required: true
        type: string
        default: '2026-11-03'

permissions:
  contents: read

jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: api/requirements.txt
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Calcular NDVI alternativo sin publicar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          OPENEO_REFRESH_TOKEN: ${{ secrets.OPENEO_REFRESH_TOKEN }}
          PARCELA_ID: ${{ inputs.parcela_id }}
          FECHA_ESCENA: ${{ inputs.fecha_escena }}
        run: python prueba_ndvi_scl7.py
      - name: Guardar mapas para comparacion
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DELTA-comparacion-NDVI-SCL7
          path: |
            api/artefactos/ndvi_original.png
            api/artefactos/ndvi_scl7.png
          retention-days: 7
