name: DELTA - Publicar mapas complementarios
run-name: SAVI-EVI2-CAMBIO ${{ inputs.parcela_id }} ${{ inputs.fecha_escena }}

on:
  workflow_dispatch:
    inputs:
      parcela_id:
        description: "UUID de la parcela"
        required: true
        type: string
      fecha_escena:
        description: "Fecha de los mapas NDVI/NDMI existentes (YYYY-MM-DD)"
        required: true
        type: string
      publicar:
        description: "Publicar archivos en Supabase (desmarcado: solo prueba)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: delta-complementarios-${{ inputs.parcela_id }}-${{ inputs.fecha_escena }}
  cancel-in-progress: false

jobs:
  complementarios:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r requirements.txt
      - name: Validar o publicar SAVI EVI2 y cambio NDVI
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          OPENEO_REFRESH_TOKEN: ${{ secrets.OPENEO_REFRESH_TOKEN }}
          PARCELA_ID: ${{ inputs.parcela_id }}
          FECHA_ESCENA: ${{ inputs.fecha_escena }}
          PUBLICAR_COMPLEMENTARIOS: ${{ inputs.publicar }}
        run: python publicar_mapas_complementarios.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DELTA-complementarios-revision
          path: api/artefactos/complementarios_publicacion/
          if-no-files-found: warn
