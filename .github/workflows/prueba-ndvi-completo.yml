name: DELTA - Diagnostico NDVI completo

on:
  workflow_dispatch:
    inputs:
      parcela_id:
        description: "ID de parcela"
        required: true
        type: string

permissions:
  contents: read

jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Probar NDVI original completo en Copernicus
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          OPENEO_REFRESH_TOKEN: ${{ secrets.OPENEO_REFRESH_TOKEN }}
          PARCELA_ID: ${{ inputs.parcela_id }}
        run: python -u prueba_ndvi_completo.py
