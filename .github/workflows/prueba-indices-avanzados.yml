name: DELTA - Prueba MSI y NDRE

on:
  workflow_dispatch:
    inputs:
      parcela_id:
        description: "Parcela de prueba"
        required: true
        type: string
        default: "8e6a5e27-d0f4-4e49-a573-1387aec88598"
      fecha_escena:
        description: "Fecha Sentinel-2 (YYYY-MM-DD)"
        required: true
        type: string
        default: "2026-11-03"

permissions:
  contents: read

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: api
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Calcular MSI y NDRE sin publicar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          OPENEO_REFRESH_TOKEN: ${{ secrets.OPENEO_REFRESH_TOKEN }}
          PARCELA_ID: ${{ inputs.parcela_id }}
          FECHA_ESCENA: ${{ inputs.fecha_escena }}
        run: python prueba_indices_avanzados.py
      - name: Guardar vistas para inspeccion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delta-msi-ndre-prueba
          path: api/artefactos/avanzados/*
          if-no-files-found: warn
