
name: DELTA - Indices agricolas

on:
  workflow_dispatch:
    inputs:
      parcela_id:
        description: "ID de la parcela solicitada"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: delta-indices-${{ inputs.parcela_id }}
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: api

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Calcular indices
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          OPENEO_REFRESH_TOKEN: ${{ secrets.OPENEO_REFRESH_TOKEN }}
          PARCELA_ID: ${{ inputs.parcela_id }}
        run: python actualizar_indices.py
