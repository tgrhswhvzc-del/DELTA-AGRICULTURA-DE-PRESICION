
name: DELTA - Indices agricolas

on:
  workflow_dispatch:
    inputs:
      parcela_id:
        description: "ID de la parcela solicitada"
        required: true
        type: string

      forzar_regeneracion:
        description: "Recalcular mapas existentes"
        required: false
        type: boolean
        default: false
      solo_validar:
        description: "Calcular sin publicar mapas"
        required: false
        type: boolean
        default: false



permissions:
  contents: read
  actions: write

concurrency:
  group: delta-indices-${{ inputs.parcela_id }}
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: api

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Calcular indices
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          OPENEO_REFRESH_TOKEN: ${{ secrets.OPENEO_REFRESH_TOKEN }}
          PARCELA_ID: ${{ inputs.parcela_id }}
          FORZAR_REGENERACION: ${{ inputs.forzar_regeneracion }}
          SOLO_VALIDAR: ${{ inputs.solo_validar }}
        run: python actualizar_indices.py

      # DELTA_AUTO_COMPLEMENTARIOS_DESPUES_BASE
      # Se despacha SAVI/EVI2 y cambio NDVI cuando ya está listo el paquete base.
      # No recalcula mapas existentes ni invalida NDVI/NDMI si falla Copernicus.
      - name: Solicitar SAVI EVI2 y cambio NDVI de esta parcela
        if: ${{ success() && inputs.solo_validar != true }}
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GH_TOKEN: ${{ github.token }}
          PARCELA_ID: ${{ inputs.parcela_id }}
          SOLO_REVISAR: 'false'
        run: python revisar_complementarios_programado.py

      # DELTA_AUTO_AVANZADOS_DESPUES_BASE
      # Una vez que se publican NDVI/NDMI, solicitar MSI/NDRE para la misma parcela.
      # Un fallo de Copernicus o GitHub no debe marcar los índices base como fallidos.
      - name: Solicitar MSI y NDRE de esta parcela
        if: ${{ success() && inputs.solo_validar != true }}
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GH_TOKEN: ${{ github.token }}
          PARCELA_ID: ${{ inputs.parcela_id }}
          SOLO_REVISAR: 'false'
        run: python revisar_avanzados_programado.py
