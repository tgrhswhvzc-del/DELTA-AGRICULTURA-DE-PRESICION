name: DELTA - Diagnostico huecos SCL

on:
  workflow_dispatch:
    inputs:
      parcela_id:
        description: 'ID de la parcela con huecos'
        required: true
        type: string
        default: '8e6a5e27-d0f4-4e49-a573-1387aec88598'
      fecha_escena:
        description: 'Fecha YYYY-MM-DD del NDVI almacenado'
        required: true
        type: string
        default: '2026-11-03'

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: api/requirements.txt
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Diagnosticar huecos SCL
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          OPENEO_REFRESH_TOKEN: ${{ secrets.OPENEO_REFRESH_TOKEN }}
          PARCELA_ID: ${{ inputs.parcela_id }}
          FECHA_ESCENA: ${{ inputs.fecha_escena }}
        run: python diagnostico_scl.py
